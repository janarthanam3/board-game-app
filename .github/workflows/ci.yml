# Free-tier GitHub Actions: unit and integration checks only.
# The release APK is never built here (docs/11-build-and-release.md).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  install-typecheck-test:
    runs-on: ubuntu-24.04

    # The same Postgres 16 and Redis 7 that docker-compose.yml runs locally, so apps/server's
    # integration tests reach them at the documented localhost URLs (docs/09-server-config.md).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: royalnavy
          POSTGRES_PASSWORD: royalnavy
          POSTGRES_DB: royalnavy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U royalnavy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        # Version comes from "packageManager" in package.json, so it is pinned in one place.

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The root scripts exclude the root package itself, so they cannot recurse into themselves.
      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test
